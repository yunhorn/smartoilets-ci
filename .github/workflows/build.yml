  watcher:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: always()
    env:
      GHEVENT: ${{ github.event.inputs.ghevent }}
      CINAME: watcher
      GH_TOKEN: ${{ github.token }}
      CURRENT_GHEVENT: ${{ toJSON(github.event) }}
    needs:
    - prlabel 
