name: build

on:
  workflow_dispatch:
    inputs:
      triggerIssueId:
        description: 'issueId'
        required: false
      customParam:
        description: 'customParam'
        required: false
      ghevent:
        description: 'ghevent'
        required: false
      ciname: 
        description: 'ghevent'
        required: false

jobs:

  build:
    runs-on: ${{ matrix.runasos }}
    timeout-minutes: 120
    env:
      GHEVENT: ${{ github.event.inputs.ghevent }}
      CINAME: build
      GH_TOKEN: ${{ github.token }}
      CURRENT_GHEVENT: ${{ toJSON(github.event) }}
    permissions:
      packages: write
      issues: write
      pull-requests: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        runasos:
          - ubuntu-latest
          - ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK
      id: setup-java
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        settings-path: ${{ github.workspace }} # location for the settings.xml file

    - name: Create Maven Settings
      run: |
        mkdir -p ~/.m2
        cp .github/artifacts/maven-settings.xml ~/.m2/settings.xml

    - uses: oras-project/setup-oras@v1
      with:
        version: 1.0.0

    - name: build
      run: |
        oras login -uyunhorn -p${{ secrets.GITHUB_TOKEN }} ghcr.io
        oras pull ghcr.io/yunhorn/files:build
        chmod +x build.sh
        ./build.sh


  rebuild-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      packages: write
      issues: write
      pull-requests: write
      actions: write

    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK
      id: setup-java
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        settings-path: ${{ github.workspace }} # location for the settings.xml file

    - name: Create Maven Settings
      run: |
        mkdir -p ~/.m2
        cp .github/artifacts/maven-settings.xml ~/.m2/settings.xml

    - uses: oras-project/setup-oras@main
      with:
        version: 1.2.0

    - name: build
      env:
        GHEVENT: ${{ github.event.inputs.ghevent }}
        CINAME: cicache
        GH_TOKEN: ${{ github.token }}
        CURRENT_GHEVENT: ${{ toJSON(github.event) }}
      run: |
        oras pull -uyunhorn -p${{ secrets.GITHUB_TOKEN }} ghcr.io/yunhorn/files:build
        chmod +x build.sh
        ./build.sh

